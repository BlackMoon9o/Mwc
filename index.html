<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWC: Eastern Direction — Тактический Милсим</title>
    <!-- Подключаем брутальный шрифт в стиле милитари-HUD -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e11;
            --panel-bg: #14161d;
            --accent-color: #ff9f43;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            background-image: linear-gradient(rgba(13, 14, 17, 0.9), rgba(13, 14, 17, 0.95)), url('https://unsplash.com'); /* Сюда можно вставить скриншот из Армы на фон */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(20, 22, 29, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent-color); }

        /* Табы / Вкладки на чистом CSS */
        .nav-tabs {
            display: flex;
            gap: 30px;
        }

        .tab-label {
            font-family: var(--font-display);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tab-label:hover {
            color: var(--text-main);
        }

        .btn-action {
            background: var(--accent-color);
            color: #000;
            font-family: var(--font-display);
            font-weight: 700;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-action:hover {
            background: #e68a2e;
            transform: translateY(-1px);
        }

        /* Переключатели вкладок (скрытые) */
        input[type="radio"] {
            display: none;
        }

        /* Контейнер для контента */
        .main-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        /* Логика показа табов */
        #tab-main:checked ~ .main-container #content-main,
        #tab-faq:checked ~ .main-container #content-faq,
        #tab-weapons:checked ~ .main-container #content-weapons,
        #tab-map:checked ~ .main-container #content-map {
            display: block;
        }

        /* Активные стили для меню */
        #tab-main:checked ~ header label[for="tab-main"],
        #tab-faq:checked ~ header label[for="tab-faq"],
        #tab-weapons:checked ~ header label[for="tab-weapons"],
        #tab-map:checked ~ header label[for="tab-map"] {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 4px;
        }

        /* Сетка Главного экрана */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 60px;
        }

        @media (max-width: 768px) {
            .hero-grid { grid-template-columns: 1fr; gap: 40px; }
        }

        /* Левая колонка */
        .hero-left h1 {
            font-family: var(--font-display);
            font-size: 72px;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-left p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 450px;
        }

        .btn-download {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 16px 40px;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.2);
        }

        /* Правая колонка: Как начать */
        .steps-panel {
            background: rgba(20, 22, 29, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-color);
            padding: 40px;
            backdrop-filter: blur(5px);
        }

        .steps-panel h2 {
            font-family: var(--font-display);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }
        .steps-panel h2 span {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 14px;
        }

        .step-item {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }
        .step-item:last-child { margin-bottom: 0; }

        .step-num {
            font-family: var(--font-mono);
            font-size: 24px;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: -4px;
        }

        .step-text h3 {
            font-family: var(--font-display);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .step-text p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .step-text a { color: var(--accent-color); text-decoration: none; }

        /* Нижняя сетка фич */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feat-card {
            background: rgba(20, 22, 29, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 24px;
            transition: background 0.3s;
        }
        .feat-card:hover {
            background: rgba(20, 22, 29, 0.8);
        }

        .feat-icon {
            color: var(--accent-color);
            font-size: 20px;
            margin-bottom: 15px;
            font-family: var(--font-mono);
        }

        .feat-card h4 {
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .feat-card p {
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
        }

        /* Стили для остальных вкладок (заглушки) */
        .placeholder-content {
            background: var(--panel-bg);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Скрытые переключатели для CSS-табов -->
    <input type="radio" name="site-tabs" id="tab-main" checked>
    <input type="radio" name="site-tabs" id="tab-faq">
    <input type="radio" name="site-tabs" id="tab-weapons">
    <input type="radio" name="site-tabs" id="tab-map">

    <!-- Хедер сайта -->
    <header>
        <div class="logo">MWC: <span>Eastern Direction</span></div>
        
        <nav class="nav-tabs">
            <label for="tab-main" class="tab-label">Главная</label>
            <label for="tab-faq" class="tab-label">FAQ</label>
            <label for="tab-weapons" class="tab-label">Оружие</label>
            <label for="tab-map" class="tab-label">Карта</label>
        </nav>

        <a href="https://t.me" class="btn-action">Вступай в ТГ</a>
    </header>

    <!-- Основной контейнер -->
    <div class="main-container">
        
        <!-- Вкладка 1: Главная (Стиль как на скриншоте) -->
        <div class="tab-content" id="content-main">
            <div class="hero-grid">
                <!-- Левый блок -->
                <div class="hero-left">
                    <h1>В БОЙ</h1>
                    <p>Добро пожаловать на тактический Милсим-сервер. Реалистичная баллистика, жесткая субординация и масштабные операции без лишних компромиссов.</p>
                    <a href="#" class="btn-download">Начать играть</a>
                </div>
                
                <!-- Правый блок -->
                <div class="steps-panel">
