<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWC: Eastern Direction — Тактический Милсим</title>
    <!-- Подключаем брутальный шрифт в стиле милитари-HUD -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e11;
            --panel-bg: #14161d;
            --accent-color: #ff9f43;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(20, 22, 29, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent-color); }

        /* Табы / Вкладки на чистом CSS */
        .nav-tabs {
            display: flex;
            gap: 30px;
        }

        .tab-label {
            font-family: var(--font-display);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .tab-label:hover {
            color: var(--text-main);
        }

        /* Блок иконок соцсетей */
        .social-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .social-link.tg:hover {
            color: #26a5e4;
            background: rgba(38, 165, 228, 0.1);
            border-color: #26a5e4;
        }

        .social-link.ds:hover {
            color: #5865F2;
            background: rgba(88, 101, 242, 0.1);
            border-color: #5865F2;
        }

        .social-link.tt:hover {
            color: #ff0050;
            background: rgba(255, 0, 80, 0.1);
            border-color: #ff0050;
        }

        /* Переключатели вкладок (скрытые) */
        input[type="radio"] {
            display: none;
        }

        /* Контейнер для контента */
        .main-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        /* Логика показа табов */
        #tab-main:checked ~ .main-container #content-main,
        #tab-weapons:checked ~ .main-container #content-weapons,
        #tab-map:checked ~ .main-container #content-map,
        #tab-faq:checked ~ .main-container #content-faq {
            display: block;
        }

        /* Активные стили для меню */
        #tab-main:checked ~ header label[for="tab-main"],
        #tab-weapons:checked ~ header label[for="tab-weapons"],
        #tab-map:checked ~ header label[for="tab-map"],
        #tab-faq:checked ~ header label[for="tab-faq"] {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-color);
        }

        /* Сетка Главного экрана */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 60px;
        }

        .hero-left h1 {
            font-family: var(--font-display);
            font-size: 72px;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-left p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 450px;
        }

        /* Блоки с информацией в FAQ */
        .info-panel {
            background: var(--panel-bg);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-color);
        }

        .info-panel h2 {
            font-family: var(--font-display);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .faq-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .faq-block h3 {
            font-family: var(--font-display);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .faq-block p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .placeholder-content {
            background: var(--panel-bg);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Скрытые переключатели для CSS-табов -->
    <input type="radio" name="site-tabs" id="tab-main" checked>
    <input type="radio" name="site-tabs" id="tab-weapons">
    <input type="radio" name="site-tabs" id="tab-map">
    <input type="radio" name="site-tabs" id="tab-faq">

    <!-- Хедер сайта -->
    <header>
        <div class="logo">MWC: <span>Eastern Direction</span></div>
        
        <nav class="nav-tabs">
            <label for="tab-main" class="tab-label">Главная</label>
            <label for="tab-weapons" class="tab-label">Оружие</label>
            <label for="tab-map" class="tab-label">Карта</label>
            <label for="tab-faq" class="tab-label">FAQ</label>
        </nav>

        <!-- Блок иконок соцсетей (Иконка Discord теперь идеально ровная) -->

            <a href="https://discord.gg" target="_blank" class="social-link ds" title="Discord">

            </a>

            </a>
        </div>
    </header>

    <!-- Основной контейнер -->
    <div class="main-container">
        
        <!-- Вкладка 1: Главная -->
        <div class="tab-content" id="content-main">
            <div class="hero-grid">
                <div class="hero-left">
                    <h1>В БОЙ</h1>
