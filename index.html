<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWC: Eastern Direction — Тактический Милсим</title>
    <!-- Подключаем брутальные шрифты -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(20, 22, 29, 0.7);
            --accent-color: #ff9f43;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            background-image: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.95)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Навигационная панель сверху */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(20, 22, 29, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .logo span { color: var(--accent-color); }

        /* Вкладки переключения сверху */
        .nav-tabs {
            display: flex;
            gap: 25px;
            margin-left: 40px;
            margin-right: auto;
        }

        .tab-label {
            font-family: var(--font-display);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s, border-color 0.3s;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .tab-label:hover {
            color: var(--text-main);
        }

        .btn-action {
            background: var(--accent-color);
            color: #000;
            font-family: var(--font-display);
            font-weight: 700;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .btn-action:hover {
            background: #e68a2e;
        }

        /* Скрываем радио-кнопки переключения вкладок */
        input[type="radio"].tab-switch {
            display: none;
        }

        /* Контейнер для вкладок */
        .main-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* Прячем все вкладки по умолчанию */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        /* НАДЁЖНОЕ ПЕРЕКЛЮЧЕНИЕ ТАБОВ через селектор ~ */
        #tab-main:checked ~ .main-container #content-main,
        #tab-weapons:checked ~ .main-container #content-weapons,
        #tab-map:checked ~ .main-container #content-map,
        #tab-donate:checked ~ .main-container #content-donate,
        #tab-faq:checked ~ .main-container #content-faq,
        #tab-questions:checked ~ .main-container #content-questions {
            display: block;
        }

        /* Подсветка активной вкладки в меню */
        #tab-main:checked ~ header label[for="tab-main"],
        #tab-weapons:checked ~ header label[for="tab-weapons"],
        #tab-map:checked ~ header label[for="tab-map"],
        #tab-donate:checked ~ header label[for="tab-donate"],
        #tab-faq:checked ~ header label[for="tab-faq"],
        #tab-questions:checked ~ header label[for="tab-questions"] {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-color);
        }

        /* --- Стили Главной страницы --- */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
            margin-bottom: 60px;
        }

        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; gap: 40px; }
            header { flex-direction: column; gap: 15px; text-align: center; }
            .nav-tabs { margin: 10px 0; justify-content: center; }
        }

        .hero-left h1 {
            font-family: var(--font-display);
            font-size: 72px;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-left p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 450px;
        }

        .btn-download {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 16px 40px;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.2);
            transition: background 0.3s;
        }

        .btn-download:hover { background: #e68a2e; }

        /* Блок «Как начать» */
        .steps-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-color);
            padding: 40px;
            backdrop-filter: blur(5px);
        }

        .steps-panel h2 {
            font-family: var(--font-display);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }
        .steps-panel h2 span {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 14px;
        }

        .step-item {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }
        .step-item:last-child { margin-bottom: 0; }

        .step-num {
            font-family: var(--font-mono);
            font-size: 24px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-text h3 {
            font-family: var(--font-display);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .step-text p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* Карточки плюсов */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .feat-card {
            background: rgba(20, 22, 29, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--accent-color);
            padding: 30px 24px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, background 0.3s;
        }
        .feat-card:hover {
            transform: translateY(-5px);
            background: rgba(20, 22, 29, 0.8);
        }

        .feat-icon {
            color: var(--accent-color);
            font-size: 22px;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-weight: bold;
        }

        .feat-card h4 {
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .feat-card p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* --- Стили информационных панелей --- */
        .info-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-panel h2 {
            font-family: var(--font-display);
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        .faq-item {
            margin-bottom: 25px;
        }
        .faq-item:last-child { margin-bottom: 0; }

        .faq-item h3 {
            font-family: var(--font-display);
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .faq-item p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .weapons-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .weapons-table th {
            font-family: var(--font-display);
            text-transform: uppercase;
