<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWC: Eastern Direction — Тактический Милсим</title>
    <!-- Подключаем брутальные шрифты, как на скриншоте лаунчера -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e11;
            --panel-bg: rgba(20, 22, 29, 0.75);
            --accent-color: #ff9f43;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Атмосферный фон леса из лаунчера */
            background-image: linear-gradient(rgba(13, 14, 17, 0.8), rgba(13, 14, 17, 0.95)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(20, 22, 29, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent-color); }

        /* Навигация по секциям (плавный скролл) */
        .nav-tabs {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            font-family: var(--font-display);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover { color: var(--text-main); }

        /* Блок иконок соцсетей */
        .social-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .social-link.tg:hover { color: #26a5e4; background: rgba(38, 165, 228, 0.1); border-color: #26a5e4; }
        .social-link.ds:hover { color: #5865F2; background: rgba(88, 101, 242, 0.1); border-color: #5865F2; }
        .social-link.tt:hover { color: #ff0050; background: rgba(255, 0, 80, 0.1); border-color: #ff0050; }

        /* Главный контейнер сайта */
        .main-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 80px; /* Большой отступ между блоками для чистоты */
        }

        /* --- СЕТКА ДЛЯ ГЛАВНОГО ЭКРАНА --- */
        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: center;
        }

        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; gap: 40px; }
        }

        /* Левая часть: Описание и кнопка */
        .hero-left h1 {
            font-family: var(--font-display);
            font-size: 82px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-left .description {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 480px;
        }

        .hero-left .description p {
            margin-bottom: 15px;
        }

        .hero-left .description span {
            color: var(--accent-color);
            font-weight: 600;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-color);
            color: #000;
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 16px 36px;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(255, 159, 67, 0.3);
            transition: background 0.3s, transform 0.2s;
        }

        .btn-download:hover {
            background: #e68a2e;
            transform: translateY(-1px);
        }

        .alt-version {
            display: inline-block;
            margin-left: 20px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 12px;
            text-decoration: none;
            border-bottom: 1px dashed var(--text-muted);
        }
        .alt-version:hover { color: #fff; border-color: #fff; }

        /* Правая часть: Блок «Как начать» */
        .steps-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-color);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .steps-panel h2 {
            font-family: var(--font-display);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .steps-panel h2 span {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 13px;
        }

        .step-item {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
        }
        .step-item:last-child { margin-bottom: 0; }

        .step-num {
            font-family: var(--font-mono);
            font-size: 26px;
            color: var(--accent-color);
            font-weight: 700;
            line-height: 1;
        }

        .step-text h3 {
            font-family: var(--font-display);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .step-text p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .step-text span { color: var(--accent-color); font-weight: 600; }

        /* --- НИЖНЯЯ СЕТКА ХАРАКТЕРИСТИК --- */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 40px;
        }

        .feat-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feat-icon-box {
            color: var(--accent-color);
            font-size: 20px;
            font-family: var(--font-mono);
        }

        .feat-card h4 {
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .feat-card p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* --- БЛОК СИСТЕМНЫХ ТРЕБОВАНИЙ --- */
        .requirements-box {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 40px;
        }

        .requirements-box h2 {
            font-family: var(--font-display);
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .req-row {
            display: flex;
            gap: 40px;
            font-size: 14px;
        }

        .req-title {
            font-family: var(--font-display);
            text-transform: uppercase;
            color: var(--accent-color);
            letter-spacing: 1px;
            min-width: 100px;
        }

        .req-value {
            color: var(--text-muted);
        }

        /* Стили панелей информации для Оружия/Карты/FAQ */
        .info-panel {
            background: var(--panel-bg);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-color);
            backdrop-filter: blur(10px);
        }

        .info-panel h2 {
            font-family: var(--font-display);
