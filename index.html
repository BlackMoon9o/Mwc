<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWC: Eastern Direction — Тактический Милсим</title>
    <!-- Подключаем брутальный шрифт в стиле милитари-HUD -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e11;
            --panel-bg: #14161d;
            --accent-color: #ff9f43;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(20, 22, 29, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent-color); }

        /* Табы / Вкладки на чистом CSS */
        .nav-tabs {
            display: flex;
            gap: 30px;
        }

        .tab-label {
            font-family: var(--font-display);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .tab-label:hover {
            color: var(--text-main);
        }

        /* Блок иконок соцсетей */
        .social-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Кастомный цвет при наведении для каждой соцсети */
        .social-link.tg:hover {
            color: #26a5e4;
            background: rgba(38, 165, 228, 0.1);
            border-color: #26a5e4;
        }

        .social-link.ds:hover {
            color: #5865F2;
            background: rgba(88, 101, 242, 0.1);
            border-color: #5865F2;
        }

        .social-link.tt:hover {
            color: #ff0050;
            background: rgba(255, 0, 80, 0.1);
            border-color: #ff0050;
        }

        /* Переключатели вкладок (скрытые) */
        input[type="radio"] {
            display: none;
        }

        /* Контейнер для контента */
        .main-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        /* Логика показа табов */
        #tab-main:checked ~ .main-container #content-main,
        #tab-weapons:checked ~ .main-container #content-weapons,
        #tab-map:checked ~ .main-container #content-map,
        #tab-faq:checked ~ .main-container #content-faq {
            display: block;
        }

        /* Активные стили для меню */
        #tab-main:checked ~ header label[for="tab-main"],
        #tab-weapons:checked ~ header label[for="tab-weapons"],
        #tab-map:checked ~ header label[for="tab-map"],
        #tab-faq:checked ~ header label[for="tab-faq"] {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-color);
        }

        /* Сетка Главного экрана */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 60px;
        }

        .hero-left h1 {
            font-family: var(--font-display);
            font-size: 72px;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-left p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 450px;
        }

        /* Стили для остальных вкладок (заглушки) */
        .placeholder-content {
            background: var(--panel-bg);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Скрытые переключатели для CSS-табов -->
    <input type="radio" name="site-tabs" id="tab-main" checked>
    <input type="radio" name="site-tabs" id="tab-weapons">
    <input type="radio" name="site-tabs" id="tab-map">
    <input type="radio" name="site-tabs" id="tab-faq">

    <!-- Хедер сайта -->
    <header>
        <div class="logo">MWC: <span>Eastern Direction</span></div>
        
        <!-- FAQ перенесен в самый конец меню -->
        <nav class="nav-tabs">
            <label for="tab-main" class="tab-label">Главная</label>
            <label for="tab-weapons" class="tab-label">Оружие</label>
            <label for="tab-map" class="tab-label">Карта</label>
            <label for="tab-faq" class="tab-label">FAQ</label>
        </nav>

        <!-- Блок новых иконок соцсетей -->

            <!-- Discord -->
            <a href="https://discord.gg" target="_blank" class="social-link ds" title="Discord">
                <svg viewBox="0 0 24 24"><path d="M19.27 4.73a16.3 16.3 0 0 0-4.02-1.25.08.08 0 0 0-.08.04c-.18.33-.37.72-.51 1.06a15.02 15.02 0 0 0-5.32 0c-.14-.34-.34-.73-.52-1.06a.08.08 0 0 0-.08-.04 16.3 16.3 0 0 0-4.02 1.25.08.08 0 0 0-.03.03C1.66 9.4.92 13.94 1.26 18.42a.07.07 0 0 0 .03.05c2.42 1.78 4.77 2.87 7.07 3.58a.09.09 0 0 0 .1-.03c.55-.75 1.05-1.54 1.49-2.37a.08.08 0 0 0-.05-.11c-.77-.29-1.51-.66-2.21-1.1a.08.08 0 0 1-.01-.13c.15-.11.3-.23.44-.35a.08.08 0 0 1 .08-.01c4.58 2.1 9.57 2.1 14.07 0a.08.08 0 0 1 .09.01c.14.12.29.24.44.35a.08.08 0 0 1-.01.13c-.7.44-1.44.81-2.21 1.1a.08.08 0 0 0-.05.11c.44.83.94 1.62 1.49 2.37a.08.08 0 0 0 .1.03c2.31-.71 4.66-1.8 7.07-3.58a.07.07 0 0 0 .03-.05c.42-5.1-.71-9.61-3.2-13.66a.08.08 0 0 0-.03-.03zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/></svg>

            <!-- TikTok -->
            <a href="https://tiktok.com" target="_blank" class="social-link tt" title="TikTok">
                <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.03 1.62 4.17.93.99 2.22 1.6 3.56 1.89v3.86c-1.27-.07-2.52-.51-3.57-1.24-.54-.37-1.03-.84-1.42-1.39v7.13c-.04 2.11-.74 4.21-2.12 5.81-1.34 1.61-3.34 2.64-5.43 2.76-2.16.15-4.42-.48-6.14-1.83-1.83-1.4-2.94-3.66-2.92-5.99.01-2.28 1.1-4.52 2.87-5.96 1.67-1.4 3.92-2.07 6.11-1.84v3.89c-1.12-.2-2.29.08-3.19.78-.96.71-1.5 1.88-1.47 3.09.01 1.2.61 2.34 1.57 3.03.94.69 2.15.93 3.29.69 1.11-.21 2.08-.99 2.53-2.02.26-.54.36-1.14.35-1.74V.02z"/></svg>
            </a>
        </div>
    </header>

    <!-- Основной контейнер -->
    <div class="main-container">
        
        <!-- Вкладка 1: Главная -->
        <div class="tab-content" id="content-main">
            <div class="hero-grid">
                <div class="hero-left">
                    <h1>В БОЙ</h1>
                    <p>Добро пожаловать на тактический Милсим-сервер. Реалистичная баллистика, жесткая субординация и масштабные операции без лишних компромиссов.</p>
                </div>
            </div>
        </div>

        <!-- Вкладка 2: Оружие -->
        <div class="tab-content" id="content-weapons">
            <div class="placeholder-content">
                <h2>Вооружение и ТТХ</h2>
                <p style="color: var(--text-muted); margin-top: 15px;">Здесь будут таблицы с калибрами и уроном...</p>
            </div>
        </div>

        <!-- Вкладка 3: Карта -->
